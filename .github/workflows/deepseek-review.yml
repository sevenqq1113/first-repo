name: DeepSeek PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR diff
        id: diff
        run: |
          # 获取当前 PR 的代码差异，保存到文件
          git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > pr_diff.txt
          # 读取文件内容作为输出
          DIFF_CONTENT=$(cat pr_diff.txt | head -c 20000)
          echo "diff_content<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: DeepSeek Review
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          script: |
            const diffContent = `${{ steps.diff.outputs.diff_content }}`;
            
            console.log("Diff content length:", diffContent.length);
            
            if (!diffContent || diffContent.trim() === '' || diffContent.length < 10) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '## 🤖 DeepSeek 审查\n\n没有检测到有效的代码变更，无需审查。'
              });
              return;
            }
            
            const prompt = `请审查以下代码变更，指出可能存在的问题（bug、安全、性能、代码规范）。用中文回复，简洁清晰。\n\n\`\`\`diff\n${diffContent}\n\`\`\``;
            
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.DEEPSEEK_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                  { role: 'user', content: prompt }
                ],
                max_tokens: 2000,
                temperature: 0.3
              })
            });
            
            const data = await response.json();
            
            if (data.error) {
              console.error("API Error:", data.error);
              throw new Error(`DeepSeek API 错误: ${data.error.message}`);
            }
            
            const review = data.choices[0].message.content;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 DeepSeek 代码审查意见\n\n${review}`
            });
