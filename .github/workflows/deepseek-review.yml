name: DeepSeek PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff and review
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          script: |
            const { execSync } = require('child_process');
            const diff = execSync('git diff origin/main...HEAD', { encoding: 'utf8' }).slice(0, 15000);
            
            if (!diff || diff.trim() === '') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '## 🤖 DeepSeek 审查\n\n没有检测到代码变更。'
              });
              return;
            }
            
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.DEEPSEEK_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                  { role: 'system', content: '你是代码审查专家。请审查代码变更，指出bug、安全、性能、规范问题。用中文简洁回复。' },
                  { role: 'user', content: diff }
                ],
                max_tokens: 2000
              })
            });
            
            const data = await response.json();
            
            if (data.error) {
              throw new Error(`API错误: ${data.error.message}`);
            }
            
            const review = data.choices[0].message.content;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 DeepSeek 审查意见\n\n${review}`
            });
