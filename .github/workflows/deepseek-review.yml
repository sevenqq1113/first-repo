name: DeepSeek PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          echo "diff_content=$(cat diff.txt | head -c 30000)" >> $GITHUB_OUTPUT

      - name: DeepSeek Review
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          script: |
            const diff = `${{ steps.diff.outputs.diff_content }}`;
            
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.DEEPSEEK_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                  {
                    role: 'system',
                    content: '你是代码审查专家。审查代码变更，指出：1.潜在bug 2.安全问题 3.性能问题 4.代码规范。用中文回复，简洁清晰。'
                  },
                  {
                    role: 'user',
                    content: diff.slice(0, 15000)
                  }
                ],
                max_tokens: 2000
              })
            });
            
            const data = await response.json();
            const review = data.choices[0].message.content;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 DeepSeek 代码审查意见\n\n${review}`
            });
